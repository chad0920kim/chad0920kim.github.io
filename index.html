<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chad Kim — Android Developer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }
    .profile {
      text-align: center;
      margin-bottom: 60px;
    }
    .profile h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .profile p {
      color: #888;
      margin-top: 8px;
      font-size: 1rem;
    }
    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      max-width: 860px;
      width: 100%;
    }
    .app-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s;
    }
    .app-card:hover { border-color: #555; }
    .app-card h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .app-card p {
      font-size: 0.875rem;
      color: #888;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      margin-top: 14px;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: #2a2a2a;
      color: #aaa;
    }
    footer {
      margin-top: 80px;
      color: #444;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="profile">
    <h1>Chad Kim</h1>
    <p>Android Developer</p>
  </div>

  <div class="apps">
    <div class="app-card">
      <h2>한눈에 미세먼지</h2>
      <p>실시간 위치 기반 미세먼지 & 대기질 정보를 한눈에 확인하는 앱</p>
      <span class="badge">Android</span>
    </div>
    <div class="app-card">
      <h2>한눈에 일정</h2>
      <p>잠금화면에서 바로 확인하는 심플한 일정 위젯 앱</p>
      <span class="badge">Android</span>
    </div>
    <div class="app-card">
      <h2>Autoplay</h2>
      <p>블루투스 연결 시 음악 앱을 자동으로 재생하는 스마트 자동화 앱</p>
      <span class="badge">Android</span>
    </div>
    <div class="app-card">
      <h2>NotiSaver</h2>
      <p>놓친 알림을 저장하고 언제든 다시 확인할 수 있는 알림 기록 앱</p>
      <span class="badge">Android</span>
    </div>
  </div>

  <footer>© 2026 Chad Kim. All rights reserved.</footer>
</body>
</html>
